[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "brace-f1"
version = "0.1.0"
description = "Reproducible DeepRacing track-excursion cohort builder for BRACE"
requires-python = ">=3.12"
dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=18",
  "scipy>=1.14",
  "shapely>=2.1,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
brace-f1-build-deepracing = "brace_f1.build:main"
brace-f1-experiment = "brace_f1.experiment:main"
brace-f1-bootstrap = "brace_f1.bootstrap:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
